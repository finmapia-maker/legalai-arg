<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Generador | LegalAI Arg</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="legalai-theme.css">
  <link rel="stylesheet" href="components.css">

  <style>
    body{
      margin:0;
      background:var(--paper);
      color:var(--ink);
      font-family:'DM Sans',sans-serif;
    }

    .topbar{
      width:100%;
      position:sticky;
      top:0;
      z-index:999;
      backdrop-filter:blur(14px);
      background:rgba(255,255,255,.72);
      border-bottom:1px solid var(--line);
    }

    .topbar-inner{
      max-width:1200px;
      margin:0 auto;
      padding:16px 24px;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    .logo{
      font-family:'Playfair Display',serif;
      font-size:1.4rem;
      font-weight:700;
      color:var(--ink);
      text-decoration:none;
    }

    .back-btn{
      text-decoration:none;
      font-size:.9rem;
      color:var(--mist);
      font-family:'DM Mono',monospace;
    }

    .section{
      padding:48px 24px 90px;
    }

    .app-wrap{
      max-width:1100px;
      margin:0 auto;
    }
  </style>
</head>

<body>

<header class="topbar">
  <div class="topbar-inner">

    <a href="index.html" class="logo">
      LegalAI Arg
    </a>

    <a href="index.html" class="back-btn">
      ← Volver al inicio
    </a>

  </div>
</header>

<main>

<!-- GENERADOR -->
<div class="section" id="sec-generador">

  <div style="max-width:720px;margin:0 auto;padding:20px 24px 0;text-align:center;">

    <div class="hero-tag">
      // Generador de documentos
    </div>

    <h2 style="
      font-family:'Playfair Display',serif;
      font-size:1.9rem;
      font-weight:700;
      color:var(--ink);
      margin-bottom:32px;
    ">
      ¿Qué documento necesitás?
    </h2>

  </div>

  <div class="app-wrap">

    <div class="steps-bar">
      <div class="step-bar active" id="step1">1 · Tipo</div>
      <div class="step-bar" id="step2">2 · Datos</div>
      <div class="step-bar" id="step25" style="display:none;"></div>
      <div class="step-bar" id="step3">3 · Pago</div>
      <div class="step-bar" id="step4">4 · Descarga</div>
    </div>

    <!-- CARD 1 -->
    <div class="card visible" id="card1">

      <div style="
        display:flex;
        gap:12px;
        flex-wrap:wrap;
        margin-bottom:16px;
        padding-bottom:16px;
        border-bottom:1px solid var(--line);
      ">

        <span style="font-size:.72rem;color:var(--mist);font-family:'DM Mono',monospace;">
          🔒 Pago seguro MP
        </span>

        <span style="font-size:.72rem;color:var(--mist);font-family:'DM Mono',monospace;">
          ⚡ Descarga inmediata
        </span>

        <span style="font-size:.72rem;color:var(--mist);font-family:'DM Mono',monospace;">
          📄 PDF listo para firmar
        </span>

      </div>

      <div class="card-title">
        ¿Qué documento necesitás?
      </div>

      <div class="card-sub">
        Escribí o elegí el tipo de documento.
      </div>

      <input
        class="doc-big"
        type="text"
        id="docInput"
        placeholder="Ej: contrato de alquiler..."
      >

      <div class="suggest-lbl">
        Elegí una categoría:
      </div>

      <div class="cat-tabs" id="catTabs">

        <button class="cat-tab active"
          onclick="setCat(this,'contratos')">
          📋 Contratos
        </button>

        <button class="cat-tab"
          onclick="setCat(this,'freelance')">
          💼 Freelance
        </button>

        <button class="cat-tab"
          onclick="setCat(this,'reclamos')">
          ⚠️ Reclamos
        </button>

        <button class="cat-tab"
          onclick="setCat(this,'personales')">
          👤 Personales
        </button>

      </div>

      <div class="suggestions" id="suggestBox"></div>

      <div class="suggest-lbl">
        País y provincia:
      </div>

      <div class="row2">

        <div>
          <select id="paisSelect">

            <option value="Argentina">🇦🇷 Argentina</option>
            <option value="Uruguay">🇺🇾 Uruguay</option>
            <option value="Chile">🇨🇱 Chile</option>

          </select>
        </div>

        <div>
          <input
            type="text"
            id="provinciaInput"
            placeholder="Provincia / Estado"
          >
        </div>

      </div>

      <div class="alert err" id="alert1"></div>

      <button
        class="btn gold"
        style="font-weight:800;font-size:1rem;"
        onclick="generarFormulario()"
      >
        Generar formulario ahora →
      </button>

    </div>

  </div>
</div>

</main>

<!-- CONFIG -->
<script>
const CONFIG = {
  WORKER_URL: "https://TU-WORKER.workers.dev"
};
</script>

<!-- JS -->
<script>

function setCat(el,cat){

  document.querySelectorAll('.cat-tab')
    .forEach(btn=>btn.classList.remove('active'));

  el.classList.add('active');

}

function generarFormulario(){

  const doc =
    document.getElementById('docInput').value;

  if(!doc){

    document.getElementById('alert1')
      .innerHTML = "Indicá qué documento necesitás";

    document.getElementById('alert1')
      .classList.add('alert-show');

    return;
  }

  alert("Acá continúa el flujo del formulario");

}

</script>

</body>
</html>
